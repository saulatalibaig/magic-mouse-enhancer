ShortDescription: Enables full Apple Magic Mouse functionality on Windows - smooth scrolling, two-finger gestures, pinch-to-zoom and Smart Zoom, with no paid drivers.
Description: |-
  Enables full Apple Magic Mouse functionality on Windows 10 and 11: smooth one-finger
  scrolling (vertical and horizontal) and two-finger swipe gestures, with no paid drivers.

  The app reads the mouse's touch surface over HID and injects the corresponding Windows
  input (mouse wheel, horizontal wheel, keyboard shortcuts) - exactly like a driver would,
  but as a small system-tray application. Over Bluetooth it layers on top of Apple's own
  kernel driver to add the gesture features Windows lacks.

  Features include two-finger swipe for Back/Forward and Task view/Show desktop, pinch to
  zoom, Smart Zoom (double-tap), tap to click, two-finger tap for middle click, low-battery
  alerts, and configurable scroll and pinch sensitivity.

  Connection notes: over USB the app reads the touch surface directly and all gestures work
  with no driver installed. Over Bluetooth, Windows blocks HID feature reports from user
  mode, so the bundled install-apple-bt-driver.ps1 installs Apple's signed kernel driver as
  a HID lower filter, on top of which this app adds the two-finger gestures. Requires Windows
  10 build 17763 or newer, x64.
